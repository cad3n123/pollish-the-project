<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Slideshow</title>
    <meta name="description" content="A small demo site that showcases a simple JavaScript slideshow.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <img id='background' src="./images/background.png" alt="background">
        <button id="prev" class="arrow" aria-label="Previous slide">&#8249;</button>
        <button id="next" class="arrow" aria-label="Next slide">&#8250;</button>
        <img class="slide active" src="./images/img1.png" alt="img1">
        <img class="slide" src="./images/img2.png" alt="img2">
    </main>
    <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->

    <script src="script.js" async defer></script>
</body>

</html>
